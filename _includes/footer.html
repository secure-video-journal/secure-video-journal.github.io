<script>
  // Sources and other external links in posts open in a new tab, so readers keep their place.
  // Links to the blog and to innerarc.me (signup, app) stay in the same tab.
  document.querySelectorAll('.post-content a[href^="http"]').forEach(function (link) {
    if (!/(^|\.)innerarc\.me$/.test(link.hostname)) {
      link.target = '_blank';
      link.rel = 'noopener';
    }
  });
</script>
